<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Registration</title>
</head>
<body>
    <div class="form-registration">
        <h1>Race Registration!</h1>
        <form action="">

            <!-- name -->
            <div>
                <label for="first">First Name: </label>
                <input type="text" name="firstname" id="first" required>
                <label for="last">Last Name: </label>
                <input type="text" name="lastname" id="last" required>
            </div>

            <!-- radio -->
            <p>Race Type:</p>
            <div>
                <input type="radio" name="race" id="funrun" value="funrun">                
                <label for="funrun">Fun Run 5k:</label>
            </div>   
            <div>
                <input type="radio" name="race" id="half" value="half">
                <label for="half">Half Marathon</label>
            </div>             
            <div>
                <input type="radio" name="race" id="full" value="full">
                <label for="full">Full Marathon</label>
            </div>

            <!-- user -->
            <div>
                <label for="email">Email: </label>
                <input type="email" name="email" id="email" required>
                <label for="password">Passsword: </label>
                <input type="password" name="password" id="password" minlength="5" maxlength="25" required>
            </div>

            <!-- dropdown -->
            <div>
                <label for="age">Select age group</label>
                <select name="age" id="age">
                    <option value="kids">Under 18</option>
                    <option value="ya">18 - 30</option>
                    <option value="adults">30 - 50</option>
                    <option value="senior">50+</option>
                </select>
            </div>
            <button>Register</button>

        </form>
    </div>    
</body>
</html>
