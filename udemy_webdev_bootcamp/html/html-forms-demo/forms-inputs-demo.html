<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Demo</title>
</head>
<body>
    <h1>Forms Demo</h1>
    <!-- default action of button submit  -->
    <form action="/tacos">
        <p>
            <label for="username">Enter a username:</label>
            <input type="text" placeholder="username" id="username" name="username">
        </p>
        <p>
            <label for="password">Enter your password:</label>
            <input type="password" placeholder="password" id="password" name="password">
        </p>
        <p>
            <label for="color">Enter a color</label>
            <input type="color" id="color" name="color">
        </p>
        <p>
            <label for="number">Enter a number</label>
            <input type="number" placeholder="number" id="number" name="num">
        </p>
        <!-- this button doesn't submit the from b/c of the "type" attribute -->
        <button type="button">Regular button (Won't submit)</button>
        <!-- this button submit the form -->
        <button>Submit</button>
        <!-- So does this one: -->
        <input type="submit" value="Click me">
    </form>
    <hr>
    <!-- Outside of a form, no default behavior -->
    <button>Not Inside Form</button>

    <!-- name attribute is used by the server to identify the fields in form submits when submitting forms -->
    <h3>Search Reddit</h3>
    <form action="https://www.reddit.com/search">
        <input type="text" name="q" id="">
        <button>Search Reddit</button>
    </form>

    <h3>Search Google</h3>
    <form action="https://www.google.com/search">
        <input type="text" name="q" id="">
        <button>Search Google</button>
    </form>

    <h3>Search Youtube</h3>
    <form action="https://www.youtube.com/results">
        <input type="text" name="search_query" id="">
        <button>Search Youtube</button>
    </form>

    <h2>More Inputs!</h2>
    <!-- assigning an action to form so that the button can submit(default action)-->
    <form action="">
        <label for="agree">I agree for everything</label>
        <input type="checkbox" name="agree_tos" id="agree">

        <p>
            <!-- Assigned a single value name(size) for group of size in order to select 1 radio button or value per group -->
            <h4>Radio Button</h4>
            <h4>Size</h4>
            <label for="xs">XS:</label>
            <input type="radio" name="size" id="xs" value="extra-small">
            <label for="s">Small:</label>
            <input type="radio" name="size" id="s" value="small">
            <label for="m">Medium:</label>
            <input type="radio" name="size" id="m" value="medium">
        </p>

        <p>
            <h4>Drop Down</h4>
            <label for="meal">Please select an Entree</label>
            <select name="meal" id="meal">
                <option value="fish" selected>Fish</option>
                <option value="veg">Vegetarian</option>
                <option value="steak">Steak</option>
            </select>
        </p>

        <p>
            <h4>Range Input</h4>
            <label for="cheese">Amount for Cheese</label>
            <input type="range" name="cheese"  min="1" max="100" step="5" value="25" id="cheese_level">
        </p>

        <p>
            <label for="requests">Any Special Request</label><br>
            <!-- textarea rows & col is for the size of textarea -->
            <textarea name="requests" id="requests" cols="50" rows="10"></textarea>
        </p>

        <button>submit</button>
    </form>
</body>
</html>
