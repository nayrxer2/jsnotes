<!DOCTYPE html>

<head>
    <title>DOM / Events Practice</title>
    <!--LEAVE THESE LINES ALONE, PLEASE! THEY MAKE THE LIVE PREVIEW WORK!-->
    <script src="node_modules/babel-polyfill/dist/polyfill.js" type="text/javascript"> </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<style>        
    div {
        display: inline-block;
        text-align: center;
    }

    .img-poke {
        display: flex;
        margin: auto;
        border: none;
        border-radius:12px;
        padding: 6px 12px;
        transition: 100ms;
    }

    .img-poke:hover {
        transform: scale(1.1);
    }

    .img-shadow {
        filter: drop-shadow(5px 7px 5px rgb(167, 167, 167));
    }

    img:hover {
        transform: scale(1.3);
        filter: drop-shadow(5px 7px 5px rgb(102, 73, 73));
    }

    img {
        transition: 100ms;
    }

    .btn-style:hover {
        transform: scale(1.1);
    }

    .btn-style {
        transition: 100ms;

        padding: 12px 24px;
        background-color: #fdeed6; 
        border: none; 
        border-radius: 8px; 
        filter: drop-shadow(1px 1px 14px #eeeeee);
    }

    .btnBckgrnd {
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
    }
    
</style>
<body>
    <h1 class="rainbow">
        <span class="">R</span>
        <span>A</span>
        <span>I</span>
        <span>N</span>
        <span>B</span>
        <span>O</span>
        <span>W</span>
    </h1>

    <button id="changeColor" class="btnBckgrnd" >Change Background color</button>
    <h2>COLOR</h2>
    <div class="btnDiv">
        <button id="btnChngBtn">Change pokemon number to button</button>
    </div>
    <div id="container">

    </div>
    <script src="../js/components/dom.js"></script>
    <script src="../js/components/events.js"></script>
    <script>
        "use strict";
        //rainbow
        const colors = ['red', 'orange', 'yellow', 'green', 'blue', 'indigo', 'violet'];

        const spans = document.querySelectorAll('h1 > span')

        for(let i = 0; i < spans.length; i++) {
            spans[i].style.color = colors[i];
            console.log(`${[i]} ${colors[i]}`)
        }

    </script>
</body>

</html>
